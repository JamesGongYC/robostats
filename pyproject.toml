[project]
name = "robostats"
version = "0.0.1"
description = "Statistics and uncertainty quantification for robot policy evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]
license = "Apache-2.0"

[project.optional-dependencies]
vla-eval = []
lerobot = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "statsmodels>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100